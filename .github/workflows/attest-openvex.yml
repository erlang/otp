##
## Signs the OpenVEX documents on this branch by calling the attestation
## workflow kept on master.
##
## The path filter must stay restricted to otp-*.openvex.json: the called
## workflow commits the .sigstore files back to this branch using a GitHub
## App token, and App token pushes do trigger workflows. Matching the
## signature files here would loop.
##

name: OpenVEX Attestation

on:
  push:
    branches: [openvex]
    paths:
      - 'otp-*.openvex.json'

permissions:
  contents: read

concurrency:
  group: openvex-attestation

jobs:
  attest:
    permissions:
      contents: read
      attestations: write
      id-token: write
    uses: erlang/otp/.github/workflows/reusable-vex-attest.yml@master
    secrets: inherit
