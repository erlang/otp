name: Build Erlang/OTP (build)

on:
  workflow_call:
    inputs:
      base_branch:
        description: "The base branch to build against"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Erlang/OTP
    ## 32-bit and cross-compile build inside an i386/debian container.
    ## On ubuntu-26.04 the preinstalled Docker's default seccomp profile
    ## blocks the socketcall syscall that 32-bit glibc needs for sockets,
    ## which breaks name resolution inside the container
    ## (https://github.com/actions/runner-images/issues/14790).
    ## Pin those to ubuntu-24.04 until a fixed Docker lands on the runner.
    ## clang is a 64-bit build and stays on ubuntu-latest.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read   # actions/checkout + ./.github/actions/build-base-image
    strategy:
      matrix:
        include:
          - type: 32-bit
            runner: ubuntu-24.04
          - type: cross-compile
            runner: ubuntu-24.04
          - type: clang
            runner: ubuntu-latest
      fail-fast: false

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build Base Image
        uses: ./.github/actions/build-base-image
        with:
            BASE_BRANCH: ${{ inputs.base_branch }}
            TYPE: ${{ matrix.type }}
