## File: erl-xcomp-aarch64-qnx.conf
##
## -----------------------------------------------------------------------------
## Cross compilation configuration for QNX Neutrino RTOS (aarch64).
##
## Prerequisites:
##   - QNX Software Development Platform (SDP) 8.0 or later
##   - Source the QNX environment before building:
##       source ~/qnx800/qnxsdp-env.sh
##     This sets QNX_HOST, QNX_TARGET, and adds the toolchain to PATH.
##
## When cross compiling Erlang/OTP using `otp_build', pass the path to this
## file as an argument to `otp_build' in the configure stage:
##   `otp_build configure --xcomp-conf=xcomp/erl-xcomp-aarch64-qnx.conf'
## -----------------------------------------------------------------------------

## -- Variables for `otp_build' Only -------------------------------------------

# * `erl_xcomp_build' - The build system used.
erl_xcomp_build=guess

# * `erl_xcomp_host' - Cross host/target system to build for.
erl_xcomp_host=aarch64-unknown-nto-qnx8.0.0

# * `erl_xcomp_configure_flags' - Extra configure flags to pass to the
#   `configure' script.
#   OpenSSL paths: headers in $QNX_TARGET/usr/include, libs in $QNX_TARGET/aarch64le/usr/lib
erl_xcomp_configure_flags="--disable-jit --without-wx --without-javac --without-odbc --with-ssl=$QNX_TARGET/aarch64le/usr --with-ssl-incl=$QNX_TARGET/usr"

## -- Cross Compiler and Other Tools -------------------------------------------

# * `CC' - C compiler.
#   Using ntoaarch64-gcc directly instead of qcc wrapper to avoid -V flag issues
#   during dependency generation.
CC=ntoaarch64-gcc

# * `CFLAGS' - C compiler flags.
CFLAGS="-O2"

# * `CXX' - C++ compiler.
CXX=ntoaarch64-g++

# * `CXXFLAGS' - C++ compiler flags.
CXXFLAGS="-O2"

# * `LD' - Linker.
LD=ntoaarch64-gcc

# * `LDFLAGS' - Linker flags.
#   QNX requires -lsocket for networking functions (recvmsg, sendmsg, etc.)
LDFLAGS="-lsocket"

# * `RANLIB' - `ranlib' archive index tool.
RANLIB=ntoaarch64-ranlib

# * `AR' - `ar' archiving tool.
AR=ntoaarch64-ar

# * `STRIP' - `strip' tool for removing symbols.
STRIP=ntoaarch64-strip

## -- Cross System Root Locations ----------------------------------------------

# * `LIBS' - Libraries to link with.
#   QNX requires -lsocket for networking functions (socket, connect, bind, etc.)
LIBS="-lsocket"

# * `SOCKET_LIBS' - Socket libraries for linking.
#   Configure auto-detection fails in cross-compilation because it tests the
#   host (Linux), not the target (QNX). Force -lsocket for QNX.
SOCKET_LIBS="-lsocket"

# * `erl_xcomp_sysroot' - The absolute path to the system root of the cross
#   compilation environment.
erl_xcomp_sysroot=$QNX_TARGET

## -- Autoconf Cache Variable Overrides for Cross-Compilation ----------------
## These override configure's runtime tests which would incorrectly test
## the build host (Linux) instead of the target (QNX).

# QNX has connect() in libsocket, not libc - force socket library detection
export ac_cv_func_connect=no

# QNX does not have openpty()
export ac_cv_func_openpty=no

# QNX does not have gethostbyname_r (reentrant version)
export ac_cv_func_gethostbyname_r=no
